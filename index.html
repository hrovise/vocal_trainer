<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f111a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Вокальный Тренажёр</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0f111a;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }
    
    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .app-title { font-size: 18px; font-weight: 800; color: #58a6ff; }
    
    /* Big Start Button */
    .btn-main {
      width: 100%;
      max-width: 600px;
      background: #238636;
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(35, 134, 54, 0.4);
      margin-bottom: 10px;
      transition: transform 0.1s, background-color 0.2s;
      touch-action: manipulation;
    }
    .btn-main:active { transform: scale(0.97); }
    .btn-main.stop { background: #da3633; box-shadow: 0 4px 14px rgba(218, 54, 51, 0.4); }

    /* Results Header */
    .info-card {
      width: 100%;
      max-width: 600px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 10px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .note-info {
      display: flex;
      flex-direction: column;
    }
    .note-val {
      font-size: 38px;
      font-weight: 900;
      color: #2ea043;
      line-height: 1;
      letter-spacing: 0.5px;
    }
    .freq-val {
      font-size: 13px;
      color: #8b949e;
      margin-top: 4px;
      font-weight: 600;
    }
    
    .status-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .badge {
      font-size: 13px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 16px;
      background: #21262d;
      color: #8b949e;
      text-align: right;
      max-width: 190px;
    }
    .badge.perfect { background: #238636; color: #fff; box-shadow: 0 0 10px rgba(35,134,54,0.5); }
    .badge.too-high { background: #d29922; color: #fff; }
    .badge.too-low { background: #1f6feb; color: #fff; }

    /* VU Meter */
    .vu-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vu-label { font-size: 11px; color: #8b949e; }
    .vu-bg {
      width: 70px;
      height: 8px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
    }
    .vu-fill {
      height: 100%;
      width: 0%;
      background: #2ea043;
      transition: width 0.05s ease-out;
    }

    /* Piano Reference Buttons: 2 rows of touch-friendly keys */
    .piano-section {
      width: 100%;
      max-width: 600px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .piano-title {
      font-size: 12px;
      font-weight: bold;
      color: #8b949e;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .piano-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .p-key {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 12px 6px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s, background-color 0.15s, border-color 0.15s;
    }
    .p-key:active, .p-key.playing {
      background: #1f6feb !important;
      color: #ffffff !important;
      border-color: #58a6ff !important;
      transform: scale(0.94);
      box-shadow: 0 0 10px rgba(31, 111, 235, 0.6);
    }
    .p-key small {
      display: block;
      font-size: 10px;
      font-weight: normal;
      color: #8b949e;
      margin-top: 2px;
    }
    .p-key:active small, .p-key.playing small { color: #d0e2ff; }

    /* Canvas Graph */
    .canvas-container {
      width: 100%;
      max-width: 600px;
      height: 380px;
      background: #090d13;
      border: 1px solid #30363d;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tip-box {
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
      padding: 8px 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      font-size: 11px;
      color: #8b949e;
      line-height: 1.4;
      text-align: center;
    }
    .tip-box b { color: #58a6ff; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="app-title">🎙️ Вокальный Тренажёр</div>
    <div class="vu-wrapper">
      <span class="vu-label">Микр:</span>
      <div class="vu-bg"><div class="vu-fill" id="vuFill"></div></div>
    </div>
  </div>

  <button class="btn-main" id="toggleBtn">
    <span>Включить микрофон</span>
  </button>

  <div class="info-card">
    <div class="note-info">
      <div class="note-val" id="noteVal">—</div>
      <div class="freq-val" id="freqVal">Пой любую гласную</div>
    </div>
    <div class="status-col">
      <div class="badge" id="badge">Жду голос...</div>
    </div>
  </div>

  <!-- Touch-friendly Piano Grid (Large targets for thumb) -->
  <div class="piano-section">
    <div class="piano-title">
      <span>🔊 ЭТАЛОН НОТ (нажми пальцем):</span>
      <span id="playingNote" style="color: #58a6ff;"></span>
    </div>
    <div class="piano-grid">
      <button class="p-key" data-freq="130.81" data-label="ДО 3">ДО<small>131 Hz</small></button>
      <button class="p-key" data-freq="146.83" data-label="РЕ 3">РЕ<small>147 Hz</small></button>
      <button class="p-key" data-freq="164.81" data-label="МИ 3">МИ<small>165 Hz</small></button>
      <button class="p-key" data-freq="174.61" data-label="ФА 3">ФА<small>175 Hz</small></button>
      <button class="p-key" data-freq="196.00" data-label="СОЛЬ 3">СОЛЬ<small>196 Hz</small></button>
      <button class="p-key" data-freq="220.00" data-label="ЛЯ 3">ЛЯ<small>220 Hz</small></button>
      <button class="p-key" data-freq="246.94" data-label="СИ 3">СИ<small>247 Hz</small></button>
      <button class="p-key" data-freq="261.63" data-label="ДО 4">ДО 4<small>262 Hz</small></button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="graph"></canvas>
  </div>

  <div class="tip-box">
    💡 <b>Подсказка:</b> Тапни по ноте выше (например, РЕ или МИ) — послушай эталон и повтори голосом!
  </div>

  <script>
    const NOTE_NAMES = ["ДО (C)", "ДО#", "РЕ (D)", "РЕ#", "МИ (E)", "ФА (F)", "ФА#", "СОЛЬ (G)", "СОЛЬ#", "ЛЯ (A)", "ЛЯ#", "СИ (B)"];
    
    const MIN_MIDI = 36; // C2 (65.4 Hz)
    const MAX_MIDI = 60; // C4 (261.6 Hz)

    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let isRunning = false;
    let synthCtx = null;

    const toggleBtn = document.getElementById('toggleBtn');
    const vuFill = document.getElementById('vuFill');
    const noteVal = document.getElementById('noteVal');
    const freqVal = document.getElementById('freqVal');
    const badge = document.getElementById('badge');
    const playingNote = document.getElementById('playingNote');
    const canvas = document.getElementById('graph');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const history = [];
    const maxHistory = 120;

    // Instant Mobile Audio Synth (Bulletproof iOS / Android)
    function playTone(freq, label) {
      try {
        if (!synthCtx) {
          synthCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (synthCtx.state === 'suspended') {
          synthCtx.resume();
        }

        const now = synthCtx.currentTime;
        const osc = synthCtx.createOscillator();
        const gain = synthCtx.createGain();

        osc.type = 'triangle'; // warm, clearly audible on mobile phone speakers!
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.65, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

        osc.connect(gain);
        gain.connect(synthCtx.destination);

        osc.start(now);
        osc.stop(now + 1.2);

        badge.textContent = `🔊 Эталон: ${label}`;
        badge.className = 'badge';
        playingNote.textContent = `▶ ${label}`;
        setTimeout(() => { if (playingNote.textContent.includes(label)) playingNote.textContent = ''; }, 1300);
      } catch (e) {
        console.error(e);
      }
    }

    // Attach ultra-fast touch and pointer events to piano keys
    document.querySelectorAll('.p-key').forEach(btn => {
      const trigger = (e) => {
        e.preventDefault();
        const freq = parseFloat(btn.dataset.freq);
        const label = btn.dataset.label;
        btn.classList.add('playing');
        setTimeout(() => btn.classList.remove('playing'), 250);
        playTone(freq, label);
      };

      btn.addEventListener('touchstart', trigger, { passive: false });
      btn.addEventListener('mousedown', trigger);
    });

    // Start / Stop Microphone
    toggleBtn.addEventListener('click', async () => {
      if (isRunning) {
        stopAudio();
      } else {
        await startAudio();
      }
    });

    async function startAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            autoGainControl: true,
            noiseSuppression: false
          }
        });
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        isRunning = true;
        toggleBtn.innerHTML = '<span>⏹️ Остановить микрофон</span>';
        toggleBtn.classList.add('stop');
        requestAnimationFrame(update);
      } catch (err) {
        alert('Разрешите микрофон в браузере: ' + err.message);
      }
    }

    function stopAudio() {
      isRunning = false;
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      toggleBtn.innerHTML = '<span>Включить микрофон</span>';
      toggleBtn.classList.remove('stop');
      vuFill.style.width = '0%';
      noteVal.textContent = '—';
      freqVal.textContent = 'Остановлено';
      badge.textContent = 'Жду голос...';
      badge.className = 'badge';
    }

    function autoCorrelate(buf, sampleRate) {
      const SIZE = buf.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) {
        const val = buf[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);

      const vuPercent = Math.min(100, Math.round((rms / 0.12) * 100));
      vuFill.style.width = vuPercent + '%';

      if (rms < 0.007) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.15;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }
      const trimmed = buf.slice(r1, r2);
      const trimmedSize = trimmed.length;

      const c = new Float32Array(trimmedSize);
      for (let i = 0; i < trimmedSize; i++) {
        for (let j = 0; j < trimmedSize - i; j++) {
          c[i] = c[i] + trimmed[j] * trimmed[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < trimmedSize; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }
      let T0 = maxpos;
      if (T0 <= 0) return -1;

      const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      const a = (x1 + x3 - 2 * x2) / 2;
      const b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      return sampleRate / T0;
    }

    const buf = new Float32Array(2048);

    function update() {
      if (!isRunning) return;

      analyser.getFloatTimeDomainData(buf);
      const pitch = autoCorrelate(buf, audioCtx.sampleRate);

      let currentMidi = null;
      if (pitch > 55 && pitch < 450) {
        currentMidi = 12 * Math.log2(pitch / 440) + 69;
      }

      history.push(currentMidi);
      if (history.length > maxHistory) history.shift();

      render(currentMidi, pitch);
      requestAnimationFrame(update);
    }

    function render(currentMidi, pitch) {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);

      // Grid lines
      ctx.lineWidth = 1;
      for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
        const y = h - ((m - MIN_MIDI) / (MAX_MIDI - MIN_MIDI)) * (h - 40) - 20;
        const noteIndex = m % 12;
        const octave = Math.floor(m / 12) - 1;
        const isWhite = [0, 2, 4, 5, 7, 9, 11].includes(noteIndex);

        ctx.strokeStyle = isWhite ? "#262c36" : "#14181f";
        ctx.beginPath();
        ctx.moveTo(70, y);
        ctx.lineTo(w, y);
        ctx.stroke();

        ctx.fillStyle = isWhite ? "#8b949e" : "#383f47";
        ctx.font = isWhite ? "bold 11px sans-serif" : "9px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(`${NOTE_NAMES[noteIndex]} ${octave}`, 64, y + 4);
      }

      // Voice history curve
      ctx.lineWidth = 3.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      let drawing = false;
      ctx.beginPath();
      for (let i = 0; i < history.length; i++) {
        const m = history[i];
        const x = 75 + (i / maxHistory) * (w - 95);
        if (m !== null && m >= MIN_MIDI && m <= MAX_MIDI) {
          const y = h - ((m - MIN_MIDI) / (MAX_MIDI - MIN_MIDI)) * (h - 40) - 20;
          if (!drawing) {
            ctx.moveTo(x, y);
            drawing = true;
          } else {
            ctx.lineTo(x, y);
          }
        } else {
          drawing = false;
        }
      }
      ctx.strokeStyle = "#2ea043";
      ctx.shadowColor = "#2ea043";
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Current note text update
      if (currentMidi !== null && pitch > 55) {
        const roundedMidi = Math.round(currentMidi);
        const cents = (currentMidi - roundedMidi) * 100;
        const noteIdx = roundedMidi % 12;
        const octave = Math.floor(roundedMidi / 12) - 1;

        noteVal.textContent = `${NOTE_NAMES[noteIdx]}`;
        freqVal.textContent = `${pitch.toFixed(1)} Hz (${octave} окт)`;

        if (Math.abs(cents) < 20) {
          badge.textContent = `🎯 В яблочко!`;
          badge.className = "badge perfect";
        } else if (cents > 20) {
          badge.textContent = `🔻 Чуть выше`;
          badge.className = "badge too-high";
        } else {
          badge.textContent = `🔺 Чуть ниже`;
          badge.className = "badge too-low";
        }

        if (currentMidi >= MIN_MIDI && currentMidi <= MAX_MIDI) {
          const currY = h - ((currentMidi - MIN_MIDI) / (MAX_MIDI - MIN_MIDI)) * (h - 40) - 20;
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(w - 15, currY, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        badge.textContent = "Пой гласную...";
        badge.className = "badge";
      }
    }
  </script>
</body>
</html>
